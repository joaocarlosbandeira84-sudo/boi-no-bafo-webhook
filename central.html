<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central segura • Boi no Bafo</title><style>body{margin:0;background:#f6f1e9;color:#291b12;font:16px system-ui,Arial}header{background:#24170f;color:#f3d69d;padding:18px;text-align:center}main{max-width:780px;margin:auto;padding:16px}.panel{background:white;border:1px solid #e1d6c7;border-radius:12px;padding:17px;margin:12px 0}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccc}button{cursor:pointer;background:#245f32;color:white;border:0}button:disabled{opacity:.5}input{width:100%;box-sizing:border-box} .muted{color:#6b625b}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#852e20}.hide{display:none}.status{font-weight:700}small{display:block;margin:8px 0}</style></head><body><header><h2>🥩 Boi no Bafo</h2><div>Central de pedidos • acesso restrito</div></header><main><section id="login" class="panel"><h3>Entrar na central</h3><p>O acesso é exclusivo do e-mail administrativo autorizado.</p><input id="email" type="email" value="jc_bandeira@outlook.com" readonly><p><button id="send">Receber link de acesso por e-mail</button></p><p id="loginMsg" class="muted"></p></section><section id="admin" class="hide"><div class="panel"><div class="actions"><button id="refresh">Atualizar pedidos</button><button id="logout" class="danger">Sair</button></div><small id="who"></small><p id="notice" class="muted">Carregando...</p></div><div id="orders"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://essmanuxbwfusncvugak.supabase.co','sb_publishable_rGXVYTeArtbbhDa9P6KQbw_mLLkMkAm',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allowed='jc_bandeira@outlook.com';
$('send').onclick=async()=>{ $('send').disabled=true; $('loginMsg').textContent='Solicitando link...'; const {error}=await sb.auth.signInWithOtp({email:allowed,options:{emailRedirectTo:location.origin+'/central.html'}}); $('loginMsg').textContent=error?'Não foi possível enviar: '+error.message:'Verifique o e-mail e abra o link recebido neste navegador.'; $('send').disabled=false;};
$('logout').onclick=async()=>{await sb.auth.signOut();await start();};
$('refresh').onclick=load;
async function start(){const {data:{user}}=await sb.auth.getUser();const ok=user?.email?.toLowerCase()===allowed; $('login').classList.toggle('hide',ok);$('admin').classList.toggle('hide',!ok);if(ok){$('who').textContent='Conectado: '+user.email;await load()}else $('orders').innerHTML='';}
async function load(){ $('notice').textContent='Atualizando...';const {data,error}=await sb.from('pedidos_boi_no_bafo').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('notice').textContent='Erro ao consultar: '+error.message;return} $('notice').textContent=(data?.length||0)+' pedido(s) no banco';$('orders').innerHTML=data.length?data.map(o=>{const items=Array.isArray(o.itens)?o.itens:[];return '<article class="panel"><h3>'+esc(o.codigo||o.id.slice(0,8))+' <span class="status">• '+esc(o.status)+'</span></h3><p><b>'+esc(o.nome_cliente)+'</b> • '+esc(o.telefone)+'</p><p>'+esc(o.tipo)+' • '+esc(o.data_pedido)+' às '+esc(o.horario)+'</p>'+(o.tipo==='Entrega'?'<p>📍 '+esc(o.bairro)+' — '+esc(o.endereco)+'</p>':'')+'<p>'+items.map(x=>esc(typeof x==='string'?x:(x.nome||x.descricao||JSON.stringify(x)))).join('<hr>')+'</p><p><b>Total: '+money(o.total)+'</b> • '+esc(o.pagamento)+'</p><p>Observações: '+esc(o.observacoes||'—')+'</p><div class="actions">'+(o.status==='Aguardando confirmação'?'<button data-id="'+esc(o.id)+'" data-status="Confirmado">Confirmar pedido</button>':'')+(o.status==='Confirmado'?'<button data-print="'+esc(o.id)+'">Imprimir 2 vias</button>':'')+'<button data-id="'+esc(o.id)+'" data-status="Em preparo">Em preparo</button><button data-id="'+esc(o.id)+'" data-status="Pronto">Pronto</button><button data-id="'+esc(o.id)+'" data-status="Finalizado">Finalizado</button></div></article>'}).join(''):'<div class="panel">Nenhum pedido registrado ainda.</div>';
$('orders').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{b.disabled=true;const status=b.dataset.status;const {error}=await sb.from('pedidos_boi_no_bafo').update({status,...(status==='Confirmado'?{confirmado_em:new Date().toISOString()}:{})}).eq('id',b.dataset.id);if(error)alert('Erro: '+error.message);await load();});
$('orders').querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const o=data.find(x=>x.id===b.dataset.print);if(!o)return;const payload={code:o.codigo,createdAt:o.created_at,customerName:o.nome_cliente,customerPhone:o.telefone,fulfillment:o.tipo,deliveryZone:o.bairro,address:o.endereco,requestedTime:o.horario,payment:o.pagamento,changeFor:o.troco,subtotal:o.subtotal,deliveryFee:o.frete,total:o.total,notes:o.observacoes,items:o.itens,status:o.status};const bytes=new TextEncoder().encode(JSON.stringify(payload));let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));const encoded=btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');location.href='/pedido.html?o='+encoded;});}
sb.auth.onAuthStateChange(()=>setTimeout(start,0));start();
</script></body></html>
