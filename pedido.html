<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedido Boi no Bafo</title>
<style>
:root{--w:58mm}
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:Arial,Helvetica,sans-serif;color:#000}
.toolbar{position:sticky;top:0;background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ccc;z-index:2}
button{padding:9px 12px;border:1px solid #999;background:#fff;border-radius:8px;font-weight:700}
.wrap{max-width:900px;margin:16px auto;padding:0 12px}
.sheet{width:var(--w);max-width:100%;margin:0 auto 14px;background:#fff;padding:3mm 5mm 3mm 2mm;overflow:hidden;overflow-wrap:anywhere;box-shadow:0 1px 8px #bbb}
h1{font-size:21px;text-align:center;margin:3px 0}
.center{text-align:center;font-size:13px}
.copy{text-align:center;font-weight:800;font-size:15px;margin-bottom:6px}
.dash{border-top:1px dashed #000;margin:7px 0}
.row{display:flex;justify-content:space-between;gap:5px;font-size:13px;flex-wrap:wrap}
.item{margin:9px 0;font-size:15px;font-weight:900;overflow-wrap:anywhere;line-height:1.25}
.sub{font-size:14px;font-weight:900}
.total{font-size:20px;font-weight:900;margin-top:4px}.customer{font-size:17px;font-weight:900;overflow-wrap:anywhere;margin:6px 0}.address{font-size:15px;font-weight:900;overflow-wrap:anywhere}.item .weight{font-weight:900;text-decoration:underline}.sheet .row{overflow-wrap:anywhere}.items-title{font-size:15px;font-weight:900}.item b{font-weight:900}
.highlight-box{border:1.5px solid #000;padding:5px 4px;margin:7px 0;break-inside:avoid;overflow-wrap:anywhere}.order-code{font-size:17px;font-weight:900;text-align:center}.highlight-box .customer{margin:0}.highlight-box .item{margin:6px 0}.total-box{border:2px solid #000;padding:5px 3px;margin-top:8px}.cut{text-align:center;margin:10px auto;font-size:12px}
.err{background:#fff;padding:20px;margin:30px auto;max-width:650px}
@page{size:58mm auto;margin:0}
@media print{
  html,body{width:58mm!important;max-width:58mm!important;margin:0!important;padding:0!important;overflow:hidden!important}
  body{background:#fff}
  .toolbar{display:none}
  .wrap{margin:0;padding:0}
  .sheet{width:58mm!important;max-width:58mm!important;box-shadow:none;break-after:page;page-break-after:always;margin:0!important;padding:2mm 5mm 2mm 2mm!important;overflow:hidden!important}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .cut{display:none}
}
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="setW('80mm')">80 mm</button>
  <button onclick="setW('58mm')">58 mm</button>
  <button onclick="shareBluetooth()">📲 Enviar 2 vias ao Bluetooth</button>
  <button onclick="window.print()">🖨️ Imprimir pelo Android</button>
</div>
<div class="wrap" id="app"></div>
<script>
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function decodePayload(v){
  const pad='='.repeat((4-v.length%4)%4);
  const b64=(v+pad).replace(/-/g,'+').replace(/_/g,'/');
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function weightLabel(g){return Number(g)===1000?'1 kg':g+' g'}
function setW(w){document.documentElement.style.setProperty('--w',w)}
let currentOrder=null;
async function shareBluetooth(){
 if(!currentOrder)return alert('Pedido não carregado.');
 const o=currentOrder;
 const lines=(o.items||[]).map(x=>(typeof x==='string'?x:(x.descricao||[x.qtd||1,'x',x.nome||'',x.peso?x.peso+'g':'',x.valor!=null?money(Number(x.valor)*Number(x.qtd||1)):''].filter(Boolean).join(' '))));
 const base=['BOI NO BAFO','PEDIDO '+(o.code||''),'Cliente: '+(o.customerName||''),'Telefone: '+(o.customerPhone||''),'Tipo: '+(o.fulfillment||''),'Horario: '+(o.requestedTime||''),o.fulfillment==='Entrega'?'Endereco: '+(o.address||''):null,'------------------------------',...lines,'------------------------------','Subtotal: '+money(o.subtotal),'Frete: '+money(o.deliveryFee),'TOTAL: '+money(o.total),'Pagamento: '+(o.payment||''),'Observacoes: '+(o.notes||'')].filter(x=>x!==null).join('\n');
 const content='VIA 1 - COZINHA\n'+base+'\n\n\n------------------------------\nVIA 2 - CAIXA\n'+base+'\n\n';
 const file=new File([content],'pedido-'+String(o.code||'boi-no-bafo').replace(/[^a-zA-Z0-9-]/g,'')+'.txt',{type:'text/plain'});
 try{
   if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Pedido Boi no Bafo'});return;}
   if(navigator.share){await navigator.share({text:content,title:'Pedido Boi no Bafo'});return;}
   const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);alert('Arquivo salvo. Abra-o e compartilhe com seu aplicativo de impressao Bluetooth.');
 }catch(e){if(e.name!=='AbortError')alert('Nao foi possivel compartilhar: '+e.message);}
}
function receipt(o,title){
  const when=new Date(o.createdAt).toLocaleString('pt-BR');
  const schedule=o.requestedTime==='ASAP'?'O mais rápido possível':(o.requestedTime||'');
  const items=(o.items||[]).map(x=>{
    if(typeof x==='string'||x.descricao){const raw=String(typeof x==='string'?x:x.descricao);const match=raw.match(/^(.*?)(\(\s*\d+\s*g\s*\))(.*)$/i);return '<div class="item">'+(match?esc(match[1])+'<span class="weight">'+esc(match[2])+'</span>'+esc(match[3]):esc(raw))+'</div>';}
    const detalhe=x.tipo==='carne' ? weightLabel(x.peso)+' • '+money(x.precoKg)+'/kg' : esc(x.tamanho||'');
    return '<div class="item"><div class="row"><b>'+esc(x.qtd||1)+'x '+esc(x.nome||'Item')+'</b><b>'+(x.valor!=null?money(Number(x.valor)*Number(x.qtd||1)):'')+'</b></div><div class="sub">'+detalhe+'</div></div>';
  }).join('');
  const destino=o.fulfillment==='Entrega'
    ? '<div class="dash"></div><b>REGIÃO / ENTREGA</b><div>'+esc(o.deliveryZone||'')+'</div><b>ENDEREÇO</b><div class="address">'+esc(o.address||'')+'</div>'
    : '';
  const troco=o.payment==='Dinheiro'&&o.changeFor
    ? '<div><b>'+(o.changeFor==='SEM TROCO'?'SEM TROCO':'TROCO PARA '+money(Number(o.changeFor)))+'</b></div>'
    : '';
  const maquina=o.payment==='Cartão'&&o.fulfillment==='Entrega'
    ? '<div><b>LEVAR MAQUININHA</b></div>'
    : '';
  const pixOk=o.payment==='Pix'&&o.proofReceived
    ? '<div><b>PIX — COMPROVANTE RECEBIDO</b></div>'
    : '';
  return '<div class="sheet"><div class="copy">'+esc(title)+'</div><h1>Boi no Bafo</h1><div class="highlight-box"><div class="order-code">PEDIDO '+esc(o.code)+'</div><div class="center">'+esc(when)+'</div></div><div class="highlight-box"><div class="customer">CLIENTE: '+esc(o.customerName||'')+'</div></div><div><b>TIPO:</b> '+esc((o.fulfillment||'').toUpperCase())+'</div><div><b>HORÁRIO:</b> '+esc(schedule)+'</div><div class="highlight-box"><div class="items-title">CARNES E GUARNIÇÕES</div>'+items+'</div><div class="dash"></div><div class="row"><span>Subtotal</span><span>'+money(o.subtotal)+'</span></div><div class="row"><span>Taxa entrega</span><span>'+(Number(o.deliveryFee||0)===0?'GRÁTIS':money(o.deliveryFee))+'</span></div><div class="total-box"><div class="row total"><span>TOTAL</span><span>'+money(o.total)+'</span></div></div>'+destino+'<div class="dash"></div><b>PAGAMENTO</b><div>'+esc(o.payment||'')+'</div>'+pixOk+troco+maquina+'<div class="dash"></div><div class="center">pedido gerado pelo atendimento automático</div></div>';
}
try{
  const q=new URLSearchParams(location.search).get('o');
  if(!q) throw new Error('Pedido não informado');
  const o=decodePayload(q);currentOrder=o;
  document.getElementById('app').innerHTML=receipt(o,'VIA 1 — PREPARO / COZINHA')+'<div class="cut">✂────────── CORTE AQUI ──────────✂</div>'+receipt(o,'VIA 2 — CAIXA / ATENDIMENTO');
}catch(e){
  document.getElementById('app').innerHTML='<div class="err"><h2>Não foi possível abrir o pedido.</h2><p>'+esc(e.message)+'</p></div>';
}
</script>
</body>
</html>
