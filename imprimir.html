<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imprimir pedidos - Boi no Bafo</title><style>body{font-family:Arial;margin:16px;background:#eee}textarea{width:100%;height:230px}button{padding:14px;margin:10px 0;background:#186a37;color:white;border:0}.ticket{background:white;width:55mm;padding:2mm;margin:12px auto;font:11px monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}@page{size:55mm auto;margin:0}@media print{.controls{display:none}body{margin:0;background:white}.ticket{margin:0;break-after:page}.ticket:last-child{break-after:auto}}</style><div class="controls"><h2>Boi no Bafo - Impressão manual</h2><p>Copie o pedido do WhatsApp, cole abaixo e toque em Imprimir 2 vias.</p><textarea id="msg" placeholder="Cole a mensagem recebida no WhatsApp"></textarea><button id="print">Imprimir 2 vias</button><p>O celular precisa reconhecer a impressora Bluetooth por meio do sistema ou aplicativo compatível.</p></div><div id="preview"></div><script>function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}document.getElementById('print').onclick=()=>{let t=document.getElementById('msg').value.trim();if(!t)return alert('Cole o pedido recebido.');document.getElementById('preview').innerHTML=['COZINHA','ATENDIMENTO'].map(v=>'<div class="ticket"><center><b>BOI NO BAFO</b><p>VIA '+v+'</p></center><pre>'+esc(t)+'</pre></div>').join('');window.print()};</script></html>
