<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos — Boi no Bafo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f1eb;color:#21170f}
header{position:sticky;top:0;background:#2a160d;color:#fff;padding:14px 16px;z-index:3;box-shadow:0 2px 8px #0003}
header h1{margin:0;font-size:20px}header small{opacity:.8}
main{max-width:900px;margin:auto;padding:14px}.notice{background:#fff7d9;border:1px solid #e7c75c;padding:10px;border-radius:10px;margin-bottom:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001;border:1px solid #e4ddd5}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.code{font-size:19px;font-weight:800}.status{font-weight:800;padding:5px 9px;border-radius:999px;background:#eee}
.items{margin:10px 0;padding:10px;background:#faf8f5;border-radius:10px}.line{display:flex;justify-content:space-between;gap:12px;margin:4px 0}.total{font-size:18px;font-weight:800;margin-top:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button,a.btn{border:0;border-radius:9px;padding:10px 11px;font-weight:700;cursor:pointer;text-decoration:none;background:#eee;color:#20160e}
.primary{background:#2f7d32!important;color:#fff!important}.print{background:#111!important;color:#fff!important}.danger{background:#8c1b13!important;color:#fff!important}
.empty{text-align:center;padding:50px 10px;color:#76685f}
</style>
</head>
<body>
<header><h1>📋 Pedidos — Boi no Bafo</h1><small>Área interna de atendimento e impressão</small></header>
<main>
<div class="notice">Esta área é para uso interno. Cada link recebido pelo vendedor adiciona o pedido a esta lista neste aparelho.</div>
<div id="list"></div>
</main>
<script>
const KEY='boi-no-bafo-pedidos-v1';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function decode(v){const pad='='.repeat((4-v.length%4)%4);const b64=(v+pad).replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function encoded(o){const bytes=new TextEncoder().encode(JSON.stringify(o));let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
let orders=load();
const q=new URLSearchParams(location.search).get('o');
if(q){try{const o=decode(q);const i=orders.findIndex(x=>x.code===o.code);if(i>=0)orders[i]={...orders[i],...o,status:orders[i].status||o.status||'Novo'};else orders.unshift({...o,status:o.status||'Novo'});save(orders);history.replaceState(null,'',location.pathname)}catch(e){}}
function setStatus(code,status){const o=orders.find(x=>x.code===code);if(!o)return;o.status=status;save(orders);render()}
function removeOrder(code){if(!confirm('Remover este pedido da lista deste aparelho?'))return;orders=orders.filter(x=>x.code!==code);save(orders);render()}
function render(){
 const el=document.getElementById('list');
 if(!orders.length){el.innerHTML='<div class="empty">Nenhum pedido salvo neste aparelho.</div>';return}
 el.innerHTML=orders.map(o=>{
  const items=(o.items||[]).map(x=>'<div class="line"><span>'+esc(x.qtd)+'x '+esc(x.nome)+' — '+(x.tipo==='carne'?(x.peso===1000?'1 kg':esc(x.peso)+' g'):esc(x.tamanho||''))+'</span><b>'+money(Number(x.valor||0)*Number(x.qtd||1))+'</b></div>').join('');
  const quando=o.createdAt?new Date(o.createdAt).toLocaleString('pt-BR'):'';
  const frete=o.fulfillment==='Entrega'?(Number(o.deliveryFee||0)===0?'GRÁTIS':money(o.deliveryFee)):'—';
  const printUrl='/pedido.html?o='+encoded(o);
  return '<section class="card"><div class="top"><div><div class="code">'+esc(o.code)+'</div><small>'+esc(quando)+' • Cliente '+esc(o.customerPhone||'')+'</small></div><div class="status">'+esc(o.status||'Novo')+'</div></div>'+
   '<div class="items">'+items+'<div class="line"><span>Subtotal</span><b>'+money(o.subtotal)+'</b></div><div class="line"><span>Frete</span><b>'+frete+'</b></div><div class="line total"><span>TOTAL</span><span>'+money(o.total)+'</span></div></div>'+
   '<div><b>'+esc(o.fulfillment||'')+'</b> • '+esc(o.requestedTime==='ASAP'?'O mais rápido possível':o.requestedTime||'')+'</div>'+
   (o.fulfillment==='Entrega'?'<div>📍 '+esc(o.deliveryZone||'')+' — '+esc(o.address||'')+'</div>':'')+
   '<div>💳 '+esc(o.payment||'')+(o.payment==='Dinheiro'&&o.changeFor?' • '+esc(o.changeFor==='SEM TROCO'?'Sem troco':'Troco para '+money(o.changeFor)):'')+'</div>'+
   '<div class="actions"><a class="btn print" href="'+printUrl+'">🖨️ Imprimir 2 vias</a>'+
   '<button onclick="setStatus(\''+esc(o.code)+'\',\'Em preparo\')">✅ Em preparo</button>'+
   '<button onclick="setStatus(\''+esc(o.code)+'\',\'Pronto\')">🔥 Pronto</button>'+
   '<button onclick="setStatus(\''+esc(o.code)+'\',\'Saiu para entrega\')">🛵 Saiu</button>'+
   '<button class="primary" onclick="setStatus(\''+esc(o.code)+'\',\'Finalizado\')">✅ Finalizado</button>'+
   '<button class="danger" onclick="removeOrder(\''+esc(o.code)+'\')">Remover</button></div></section>'
 }).join('')
}
render();
</script>
</body>
</html>
